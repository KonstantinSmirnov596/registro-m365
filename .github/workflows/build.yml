name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Registro.slnx

      - name: Build
        run: dotnet build Registro.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Registro.slnx --configuration Release --no-build
